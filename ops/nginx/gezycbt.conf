# GezyCBT production baseline. Install as /etc/nginx/sites-available/gezycbt.
# Replace server_name and certificate paths during deployment.
limit_req_zone $binary_remote_addr zone=gezycbt_api:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=gezycbt_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name cbt.example.sch.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cbt.example.sch.id;

    root /home/ubuntu/gezycbt/current/apps/web/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/cbt.example.sch.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cbt.example.sch.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;

    include /etc/nginx/snippets/gezycbt-security-headers.conf;
    client_max_body_size 2m;
    client_body_timeout 15s;
    keepalive_timeout 30s;
    limit_conn gezycbt_conn 40;

    location = /health/live {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        access_log off;
    }

    location = /health/ready {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        access_log off;
    }

    location /api/ {
        limit_req zone=gezycbt_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_request_buffering on;
        proxy_no_cache 1;
        add_header Cache-Control "no-store" always;
    }

    # These locations are internal: the browser cannot call them directly.
    # The API may return X-Accel-Redirect only after authorization and expiry
    # checks. Storage directories stay outside the webroot.
    location /_protected/media/ {
        internal;
        alias /var/lib/gezycbt/media/;
        add_header Cache-Control "private, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /_protected/exports/ {
        internal;
        alias /var/lib/gezycbt/exports/;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* \.(?:js|css|woff2|png|jpg|jpeg|webp|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
